name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only needs to read the code.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Builds shared → api → worker → web (the web build includes the
      # Next.js type check).
      - run: npm run build
      # Sanitizer suite (packages/shared) + terminal target policy (apps/api).
      - run: npm test

  shellcheck:
    name: Shell scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # shellcheck is preinstalled on GitHub's Ubuntu runners.
      - run: shellcheck --version && shellcheck -S warning ops/*.sh

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, so a secret added and later removed is still caught
      # Pinned gitleaks release via its official container; verified fake
      # test values are listed in .gitleaksignore.
      - name: gitleaks
        run: >
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2
          git /repo --redact --no-banner --exit-code 1
