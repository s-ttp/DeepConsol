name: 🐞 Bug report
description: Something doesn't work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Do not paste real device output, credentials, subscriber
        identifiers, public IPs or customer names.** Use *Copy Sanitized* in the terminal,
        or replace values with fake ones (e.g. `192.0.2.10`, `router1.example.com`).
        Security problems → use the private [vulnerability report](https://github.com/s-ttp/DeepConsol/security/advisories/new) instead.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the workspace and connect via Telnet to …
        2. Select output and click Send to Chat
        3. …
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Installer (ops/bootstrap.sh, ops/install.sh)
        - Terminal (SSH / Telnet)
        - Chat / AI providers
        - Knowledge base / document ingestion
        - Sanitizer / filters
        - Admin console
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `git rev-parse --short HEAD` in your checkout.
      placeholder: c92a6f4
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS, Node.js version, browser (if UI-related), AI provider (if chat-related).
      placeholder: Debian 12, Node 20.20, Chrome 131, Gemini
  - type: textarea
    id: logs
    attributes:
      label: Logs (sanitized)
      description: e.g. `sudo journalctl -u deepconsol-api -n 100`. Remove secrets and real addresses first.
      render: text
  - type: checkboxes
    id: confirm
    attributes:
      label: Before submitting
      options:
        - label: I removed real credentials, subscriber data, public IPs and customer names from this report.
          required: true
