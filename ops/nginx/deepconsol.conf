# DeepConsol Nginx config — terminate TLS on 443, fan out to internal services.
#
# Routes:
#   /                       → Next.js web (3002)
#   /api/*                  → Fastify API (5001)        [/api strip]
#   /terminal/connect/*     → Terminal WSS gateway (5002) [WS upgrade]
#
# Drop into /etc/nginx/sites-available/deepconsol.conf and enable via
#   ln -s /etc/nginx/sites-available/deepconsol.conf /etc/nginx/sites-enabled/
# After install, validate:  sudo nginx -t  &&  sudo systemctl reload nginx

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Internal upstreams (all bound to 127.0.0.1; never exposed via NAT).
upstream deepconsol_web      { server 127.0.0.1:3002; keepalive 16; }
upstream deepconsol_api      { server 127.0.0.1:5001; keepalive 16; }
upstream deepconsol_terminal { server 127.0.0.1:5002; keepalive 16; }

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    ssl_certificate     /etc/ssl/deepconsol/server.crt;
    ssl_certificate_key /etc/ssl/deepconsol/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5:!3DES;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:DEEPCONSOL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Upload limit (matches UPLOAD_MAX_BYTES default 100 MiB; bump if you raise it).
    client_max_body_size 110m;
    client_body_timeout 120s;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    # Terminal WebSocket — must come BEFORE /api/ block so the WS upgrade is honored.
    location ^~ /terminal/connect/ {
        proxy_pass http://deepconsol_terminal;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 86400s;   # long-lived terminal sessions
    }

    # API (strip /api prefix). SSE chat endpoint needs no buffering.
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://deepconsol_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;       # SSE-friendly
        chunked_transfer_encoding on;
    }

    # Next.js
    location / {
        proxy_pass http://deepconsol_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Optional: redirect plain http://<ip>/ to https. Skipped because port 80 is
# in use by the screener app — visitors will know to use https://. If port 80
# is ever freed, you can add:
#   server { listen 80; return 301 https://$host$request_uri; }
